# Public knot-tools/knot-core CI — no secrets, no scripts/, no Playwright.
# Copied to .github/workflows/ci.yml by publish-to-public.sh

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json, zip, openssl, pdo_mysql
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Check platform requirements
        run: composer check-platform-reqs
      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always
      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --no-progress --level=6 --configuration=phpstan.neon.dist --memory-limit=512M

  lint-php:
    name: PHP_CodeSniffer (PSR-12)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr, phpcs
      - name: PHPCS PSR-12 on class/
        run: phpcs --standard=phpcs.xml.dist --report=checkstyle class/ | cs2pr

  frontend-build:
    name: Frontend build + vitest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: TypeScript check
        run: npx vue-tsc --noEmit
        working-directory: frontend
      - name: Lint
        run: npm run lint --if-present
        working-directory: frontend
      - name: i18n key parity
        run: npm run lint:i18n && npm run lint:i18n:compile
        working-directory: frontend
      - name: Vitest
        run: npm run test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
